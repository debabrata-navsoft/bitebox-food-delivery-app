<h2 bbDialogTitle>{{ data.title }}</h2>
<form [formRoot]="form">
  <div class="bb-dialog__content">
    <p>{{ data.message }}</p>
    @if (data.reasonLabel) {
      <np-textarea
        [formField]="form.reason"
        [label]="data.reasonLabel"
        rows="3"
        autoResize
        cdkFocusInitial
      />
      <bb-field-error [field]="form.reason" />
    }
  </div>
  <div class="bb-dialog__actions">
    <button mat-button type="button" (click)="ref.close()">Cancel</button>
    <button mat-flat-button type="submit" [class.danger]="data.danger">
      {{ data.confirmLabel ?? 'Confirm' }}
    </button>
  </div>
</form>
