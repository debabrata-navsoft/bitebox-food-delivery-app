<button
  mat-icon-button
  [matMenuTriggerFor]="menu"
  [attr.aria-label]="inbox.unread() ? 'Notifications, ' + inbox.unread() + ' unread' : 'Notifications'"
>
  <!-- The badge sits on a wrapper: Material warns about badges on aria-hidden icons. -->
  <span class="badge-host" [matBadge]="inbox.unread() > 99 ? '99+' : inbox.unread() || null" matBadgeColor="warn" matBadgeSize="small">
    <mat-icon aria-hidden="true">{{ inbox.unread() ? 'notifications_active' : 'notifications' }}</mat-icon>
  </span>
</button>

<mat-menu #menu="matMenu" xPosition="before" class="bb-inbox-menu">
  <div class="head" (click)="$event.stopPropagation()" role="presentation">
    <strong>Notifications</strong>
    @if (inbox.unread()) {
      <button mat-button type="button" (click)="inbox.markAllRead()">Mark all read</button>
    }
  </div>
  @for (n of inbox.items(); track n.id) {
    <button mat-menu-item class="item" [class.unread]="!n.readAt" (click)="open(n)">
      <span class="text">
        <span class="title">{{ n.title }}</span>
        @if (n.body) {
          <span class="body">{{ n.body }}</span>
        }
        <span class="time">{{ n.createdAt | date: 'd MMM, h:mm a' }}</span>
      </span>
      @if (!n.readAt) {
        <span class="dot" aria-label="Unread"></span>
      }
    </button>
  } @empty {
    <p class="empty">{{ inbox.loaded() ? "You're all caught up." : 'Loading…' }}</p>
  }
</mat-menu>
