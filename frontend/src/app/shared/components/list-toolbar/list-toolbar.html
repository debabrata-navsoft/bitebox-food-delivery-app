<np-text-input
  [formField]="list().toolbar.search"
  [ariaLabel]="searchLabel()"
  [placeholder]="placeholder()"
  icon="search"
  clearable
/>
<bb-filter-panel
  [sections]="sections()"
  [value]="list().panel()"
  [preview]="list().preview"
  (apply)="list().panel.set($event)"
/>
@if (sortOptions(); as options) {
  <np-select [formField]="list().toolbar.sort" ariaLabel="Sort" [options]="options" />
}
