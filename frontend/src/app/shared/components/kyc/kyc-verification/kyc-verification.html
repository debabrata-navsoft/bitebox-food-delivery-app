<ng-content select="[status]" />

@if (canResubmit()) {
  <div class="resubmit">
    <span class="bb-muted">Fixed everything that was asked?</span>
    <button type="button" class="bb-btn" [disabled]="resubmitting()" (click)="send()">
      {{ resubmitting() ? 'Sending…' : 'Send for review' }}
    </button>
  </div>
}

<div class="grid">
  <section class="bb-card" aria-labelledby="details-title">
    <h3 id="details-title">{{ detailsTitle() }}</h3>
    <ng-content />
  </section>

  <section class="bb-card" aria-labelledby="bank-title">
    <h3 id="bank-title">Bank account</h3>
    <bb-payout-account-form
      [account]="summary()?.payoutAccount ?? null"
      (saved)="kycData.set($event)"
    />
  </section>
</div>

<section class="bb-card" aria-labelledby="docs-title">
  <header class="docs-head">
    <h3 id="docs-title">Documents</h3>
    @if (summary(); as s) {
      <span class="bb-badge {{ s.complete ? 'tone-good' : 'tone-warn' }}">
        {{ s.complete ? 'All approved' : 'In progress' }}
      </span>
    }
  </header>
  @if (summary(); as s) {
    <bb-kyc-documents [summary]="s" (changed)="kycData.reload()" />
  } @else {
    <span class="bb-skeleton" style="height: 160px"></span>
  }
</section>
