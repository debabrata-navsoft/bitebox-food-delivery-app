<div class="tiles">
  @for (photo of shown(); track photo; let i = $index) {
    <bb-image-upload
      [url]="photo"
      (urlChange)="set(i, $event)"
      aspectRatio="4 / 3"
      variant="minimal"
      label="Replace photo"
    />
  }
  @if (more()) {
    <button
      type="button"
      class="more"
      (click)="showAll()"
      [attr.aria-label]="'Show all ' + photos().length + ' photos'"
    >
      <img [src]="photos()[shown().length]" alt="" />
      <span>+{{ more() }}</span>
    </button>
  }
  <!-- Keyed: after each upload a fresh, empty box replaces the one that held the photo. -->
  @for (key of [addBox()]; track key) {
    <bb-image-upload
      url=""
      (urlChange)="add($event)"
      aspectRatio="4 / 3"
      variant="minimal"
      label="Add photo"
    />
  }
</div>
<p class="bb-muted small">
  {{ photos().length }} {{ photos().length === 1 ? 'photo' : 'photos' }} (JPEG, PNG or WebP up to 2
  MB each). Add as many as you like; customers see them on your page.
</p>
