@let filtered = list().filtered();
@if (filtered && noMatch()) {
  <bb-empty-state [icon]="icon()" [title]="noMatch()!" [message]="noMatchMessage()" />
} @else {
  <bb-empty-state [icon]="icon()" [title]="title()" [message]="message()"
    ><ng-content
  /></bb-empty-state>
}
@if (filtered) {
  <p class="bb-list-clear">
    <button type="button" class="bb-link-button" (click)="list().clear()">Clear filters</button>
  </p>
}
