<bb-page-header
  title="Admins & operators"
  subtitle="Operations, finance and support admins, and operators with just the permissions you give them."
>
  <np-button severity="primary" icon="user-round-plus" label="New admin or operator" (clicked)="create()" />
</bb-page-header>

<bb-list-toolbar
  [list]="admins"
  [sections]="filterSections"
  searchLabel="Search admins"
  placeholder="Search name, email or phone"
/>

<bb-data-table [list]="list" [columns]="columns" [actions]="actions" label="Admins and operators">
  <ng-template bbEmpty>
    <bb-empty-state
      icon="user-cog"
      title="No admins match these filters"
      message="Create an operations, finance or support admin to share the work."
    />
  </ng-template>
</bb-data-table>
