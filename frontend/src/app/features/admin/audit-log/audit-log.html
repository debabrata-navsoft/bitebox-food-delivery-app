<bb-page-header
  title="Audit log"
  subtitle="Every sensitive admin action: who did what, to which account, what changed and why. Entries can't be changed or removed."
/>

<bb-list-toolbar
  [list]="log"
  [sections]="filterSections"
  searchLabel="Search the log"
  placeholder="Search descriptions or a record id"
/>

<bb-data-table [list]="list" [columns]="columns" label="Audit log" [rowsOptions]="[50, 100]">
  <ng-template bbEmpty>
    <bb-empty-state
      icon="scroll-text"
      title="Nothing recorded yet"
      message="Admin actions such as approvals, cancellations and payouts appear here."
    />
  </ng-template>
  <ng-template [bbCellOf]="list" bbCell="changes" let-e>
    <ul class="changes">
      @for (c of changeItems(e); track $index) {
        <li>
          <span class="field">{{ c.label }}</span>
          @if (c.added || c.removed) {
            <span class="list">
              @for (x of c.added; track x) {
                <span class="pill added">+ {{ x }}</span>
              }
              @for (x of c.removed; track x) {
                <span class="pill removed">− {{ x }}</span>
              }
            </span>
          } @else {
            <span class="values">
              @if (c.from !== undefined) {
                <span class="from">{{ c.from }}</span>
                <span class="arrow" aria-label="changed to">→</span>
              }
              <span class="to">{{ c.to }}</span>
            </span>
          }
        </li>
      }
    </ul>
    @if (e.ip) {
      <span class="ip">IP {{ e.ip }}</span>
    }
  </ng-template>
</bb-data-table>
