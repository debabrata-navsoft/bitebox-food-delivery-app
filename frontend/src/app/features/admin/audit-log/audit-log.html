<bb-page-header
  title="Audit log"
  subtitle="Every sensitive admin action: who did what, to which account, what changed and why. Entries can't be changed or removed."
/>

<bb-list-toolbar
  [list]="log"
  [sections]="filterSections"
  searchLabel="Search the log"
  placeholder="Search descriptions or a record id"
/>

<bb-data-table [list]="list" [columns]="columns" label="Audit log" [rowsOptions]="[50, 100]">
  <ng-template bbEmpty>
    <bb-empty-state
      icon="scroll-text"
      title="Nothing recorded yet"
      message="Admin actions such as approvals, cancellations and payouts appear here."
    />
  </ng-template>
  <ng-template [bbCellOf]="list" bbCell="changes" let-e>
    <div class="changes">
      @for (line of changeLines(e); track $index) {
        <span>{{ line }}</span>
      } @empty {
        <span class="bb-muted">—</span>
      }
      @if (e.ip) {
        <span class="sub ref">IP {{ e.ip }}</span>
      }
    </div>
  </ng-template>
</bb-data-table>
