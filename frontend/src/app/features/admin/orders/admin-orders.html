<bb-page-header
  title="Orders"
  subtitle="Every order on BiteBox. Open one to see its history or step in."
/>

<bb-list-toolbar
  [list]="orders"
  [sections]="filterSections"
  searchLabel="Search by order number"
  placeholder="Search order number, e.g. BB-261102"
/>

@if (customer(); as id) {
  <div class="bb-alert info" role="status">
    <np-icon name="user" class="mat-icon" matButtonIcon />
    <span
      >Showing one customer's orders. <a [routerLink]="['/admin/users', id]">Open customer</a> ·
      <a routerLink="/admin/orders">Show all orders</a></span
    >
  </div>
}

<bb-data-table
  [list]="list"
  [columns]="columns"
  [actions]="actions"
  label="Orders"
  [filters]="orders"
  emptyText="No orders match these filters"
  emptyIcon="receipt_long"
>
  <ng-template [bbCellOf]="list" bbCell="status" let-o>
    <div class="badges">
      <bb-order-status-chip [status]="o.status" [label]="statusLabel(o)" />
      <span class="bb-badge {{ payment[o.paymentStatus][1] }}">{{ payment[o.paymentStatus][0] }}</span>
    </div>
  </ng-template>
</bb-data-table>
