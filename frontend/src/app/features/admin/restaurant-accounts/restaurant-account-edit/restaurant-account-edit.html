<header>
  <div>
    <h1>Edit {{ restaurant()?.name ?? 'restaurant' }}</h1>
    <p class="bb-muted">
      Changes go live at once and are recorded in the admin log. Changing a verified FSSAI or GST
      number sends that document back for review. The owner changes their own email, mobile and bank
      details.
    </p>
  </div>
  <bb-detail-nav [id]="id()" [arrows]="false" [backLink]="['/admin/restaurant-accounts', id()]" />
</header>

<bb-restaurant-details embedded />

@if (restaurant(); as r) {
  <section class="bb-card" aria-labelledby="legal-title">
    <h2 id="legal-title">Legal and tax details</h2>
    <bb-restaurant-legal-form [restaurant]="r" (saved)="state.reload()" />
  </section>
}
