<bb-page-header title="Food items" subtitle="Every dish on BiteBox across all restaurants." />

<bb-list-toolbar
  [list]="foods"
  [sections]="filterSections"
  searchLabel="Search dishes"
  placeholder="Search dishes"
/>

<bb-data-table
  [list]="list"
  [columns]="columns"
  [actions]="actions"
  label="Food items"
  [filters]="foods"
  emptyText="No dishes found"
  emptyIcon="ramen_dining"
>
  <ng-template [bbCellOf]="list" bbCell="dish" let-item>
    <span class="name" [class.off]="!item.isAvailable"
      ><bb-veg-badge [veg]="item.isVeg" /> {{ item.name }}</span
    >
  </ng-template>
  <ng-template [bbCellOf]="list" bbCell="available" let-item>
    <np-toggle
      [checked]="item.isAvailable"
      [disabled]="!canManage()"
      (checkedChange)="toggle(item, $event)"
      class="bb-label-hidden"
      [label]="'Available: ' + item.name"
    />
  </ng-template>
</bb-data-table>
