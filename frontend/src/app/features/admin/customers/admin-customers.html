<bb-page-header title="Customers" subtitle="Everyone who orders on BiteBox: their orders, spending and account status." />

<bb-list-toolbar
  [list]="accounts"
  [sections]="filterSections"
  searchLabel="Search customers"
  placeholder="Name, email, mobile or customer ID"
  [sortOptions]="sortOptions"
/>

<bb-data-table
  [list]="list"
  [columns]="columns"
  [actions]="actions"
  label="Customers"
  emptyIcon="user-search"
  emptyText="No customers match these filters."
  [filters]="accounts"
>
  <ng-template [bbCellOf]="list" bbCell="verified" let-c>
    <span class="checks">
      <span [class.ok]="c.emailVerified" [title]="c.emailVerified ? 'Email verified' : 'Email not verified'">
        <np-icon name="mail" class="mat-icon" matButtonIcon />
      </span>
      @if (c.phone) {
        <span [class.ok]="c.phoneVerified" [title]="c.phoneVerified ? 'Phone verified' : 'Phone not verified'">
          <np-icon name="smartphone" class="mat-icon" matButtonIcon />
        </span>
      }
    </span>
  </ng-template>
</bb-data-table>
