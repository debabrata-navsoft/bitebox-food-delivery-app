<bb-page-header title="Transactions" subtitle="Every customer payment: cash, online and test. Search by order number or customer to see a payment history." />

<bb-list-toolbar
  [list]="payments"
  [sections]="filterSections"
  searchLabel="Search transactions"
  placeholder="Order number, customer name, email or phone"
/>

<bb-data-table
  [list]="list"
  [columns]="columns"
  [actions]="actions"
  label="Transactions"
  [filters]="payments"
  emptyText="No payments match these filters"
  emptyIcon="payments"
>
  <ng-template [bbCellOf]="list" bbCell="orderStatus" let-p>
    @if (p.order; as o) {
      <bb-order-status-chip [status]="o.status" />
    } @else {
      —
    }
  </ng-template>
</bb-data-table>
