<bb-page-header title="Coin transactions" subtitle="Every coin earned, held, spent, expired or reversed. Rows are never edited or deleted." />

<bb-list-toolbar
  [list]="transactions"
  [sections]="filterSections"
  searchLabel="Search customers"
  placeholder="Customer name, email or phone"
/>
@if (customer()) {
  <p class="one-customer">
    Showing one customer's history.
    <button class="bb-link-button" type="button" (click)="clearCustomer()">Show everyone</button>
  </p>
}

<bb-data-table [list]="list" [columns]="columns" [actions]="actions" label="Coin transactions">
  <ng-template [bbCellOf]="list" bbCell="what" let-t>
    {{ typeLabel[t.type] }} · {{ sourceLabel[t.source] }}
    <span class="sub">{{ t.description }}</span>
    @if (t.note) {
      <span class="sub note">Note: {{ t.note }}</span>
    }
    @if (t.shortfall) {
      <span class="sub warn">{{ t.shortfall }} of {{ t.requestedCoins }} could not be collected</span>
    }
  </ng-template>
  <ng-template [bbCellOf]="list" bbCell="change" let-t>
    <span class="change" [class.up]="t.availableChange > 0" [class.down]="t.availableChange < 0">{{ coinChange(t) }}</span>
  </ng-template>
  <ng-template bbEmpty>
    <bb-list-empty [list]="transactions" icon="coins" title="No transactions match" message="Try other filters." />
  </ng-template>
</bb-data-table>
