<bb-page-header title="Reward history" subtitle="Welcome, birthday, festival and promotional rewards given to customers." />

<bb-list-toolbar
  [list]="claims"
  [sections]="filterSections"
  searchLabel="Search rewards"
  placeholder="Customer name, email or phone, or campaign"
/>

<bb-data-table [list]="list" [columns]="columns" label="Reward history">
  <ng-template bbEmpty>
    <bb-list-empty [list]="claims" icon="gift" title="No rewards given yet" noMatch="No rewards match these filters" />
  </ng-template>
</bb-data-table>
