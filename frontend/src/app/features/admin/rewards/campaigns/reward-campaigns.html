<bb-page-header title="Campaigns" subtitle="Festival and promotional rewards. Birthday and welcome rewards are in Settings.">
  @if (canManage) {
    <np-button severity="primary" icon="plus" label="New campaign" (clicked)="open()" />
  }
</bb-page-header>

<bb-list-toolbar [list]="campaigns" [sections]="filterSections" searchLabel="Search campaigns" placeholder="Search by name" />

<bb-data-table [list]="list" [columns]="columns" [actions]="actions" label="Campaigns">
  <ng-template bbEmpty>
    <bb-list-empty
      [list]="campaigns"
      icon="party-popper"
      title="No campaigns here"
      message="Create a festival or promotional campaign to reward customers."
      noMatch="No campaigns match these filters"
    >
      @if (canManage) {
        <np-button severity="primary" label="Create a campaign" (clicked)="open()" />
      }
    </bb-list-empty>
  </ng-template>
</bb-data-table>
