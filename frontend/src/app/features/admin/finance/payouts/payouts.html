<bb-page-header [title]="copy().title" [subtitle]="copy().subtitle" />

<bb-tab-strip [tabs]="tabs()" [(activeTab)]="tab" />

@if (tab() === 'due') {
  <section class="bb-card bb-list-card" aria-label="Owed now">
    @if (owed().length; as n) {
      <p class="total">{{ dueTotal() | inr }} to {{ n }} {{ n === 1 ? 'payee' : 'payees' }}</p>
    }
    @if (dueError(); as message) {
      <div class="bb-alert error inset" role="alert">
        <np-icon name="circle-alert" class="mat-icon" matButtonIcon />
        <span
          >{{ message }} <button class="bb-link-button" (click)="due.reload()">Retry</button></span
        >
      </div>
    } @else if (!due.hasValue()) {
      @for (i of [1, 2, 3]; track i) {
        <span class="bb-skeleton row"></span>
      }
    } @else if (!owed().length) {
      <bb-empty-state
        icon="hand-coins"
        title="Nothing owed right now"
        message="Earnings from new deliveries appear here."
      />
    } @else {
      <bb-data-table
        [rows]="owed()"
        [loading]="due.isLoading()"
        [columns]="dueColumns()"
        [actions]="dueActions"
        [card]="false"
        label="Owed now"
      />
    }
  </section>
} @else {
  <section class="bb-card bb-list-card" aria-label="Payout history">
    <bb-list-toolbar
      class="history-toolbar"
      [list]="payouts"
      [sections]="filterSections()"
      searchLabel="Search payouts"
      placeholder="Payee or transfer reference"
    />
    <bb-data-table
      [list]="history"
      [columns]="historyColumns()"
      [actions]="historyActions"
      [card]="false"
      label="Payout history"
    >
      <ng-template bbEmpty>
        <bb-list-empty
          [list]="payouts"
          icon="history"
          title="No payouts yet"
          noMatch="No payouts match these filters"
        />
      </ng-template>
    </bb-data-table>
  </section>
}
