<bb-page-header title="Refund management" subtitle="Paid online orders that were cancelled or rejected. A failed automatic refund shows here for a retry." />

<bb-list-toolbar
  [list]="refunds"
  [sections]="filterSections"
  searchLabel="Search refunds"
  placeholder="Order number, customer name, email or phone"
/>

<bb-data-table [list]="list" [columns]="columns" [actions]="actions" label="Refunds">
  <ng-template bbEmpty>
    <bb-list-empty
      [list]="refunds"
      icon="undo-2"
      title="No refunds here"
      message="Refunds for cancelled online orders appear here."
      noMatch="No refunds match these filters"
    />
  </ng-template>
  <ng-template [bbCellOf]="list" bbCell="order" let-r>
    <button type="button" class="bb-link-button" (click)="details(r)">{{ r.order?.orderNumber ?? 'Order removed' }}</button>
    @if (r.order?.reason) {
      <span class="sub">{{ r.order!.reason }}</span>
    }
  </ng-template>
</bb-data-table>
