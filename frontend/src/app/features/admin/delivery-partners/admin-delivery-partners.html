<bb-page-header
  title="Delivery partners"
  subtitle="Riders, their availability and current deliveries."
/>

<bb-list-toolbar
  [list]="riders"
  [sections]="filterSections"
  searchLabel="Search riders"
  placeholder="Search name, email or phone"
/>

<bb-data-table
  [list]="list"
  [columns]="columns"
  [actions]="actions"
  label="Delivery partners"
  emptyIcon="bike"
  emptyText="No delivery partners match these filters"
  [filters]="riders"
>
  <ng-template [bbCellOf]="list" bbCell="rider" let-r>
    <div class="who">
      <span
        class="dot"
        [class.on]="r.isOnline"
        role="img"
        [attr.aria-label]="r.isOnline ? 'Online' : 'Offline'"
      ></span>
      <span>
        <a class="name" [routerLink]="['/admin/delivery-partners', r.id]">{{ r.name }}</a>
        <span class="sub">{{ r.email }}{{ r.phone ? ' · ' + r.phone : '' }}</span>
      </span>
    </div>
  </ng-template>
  <ng-template [bbCellOf]="list" bbCell="availability" let-r>
    <div class="work">
      @if (r.activeOrder; as o) {
        <button type="button" class="bb-link-button" (click)="openOrder(o.id)">
          {{ o.orderNumber }}
        </button>
        <bb-order-status-chip [status]="o.status" />
      } @else {
        <span class="bb-muted">{{ r.isOnline ? 'Available' : 'Offline' }}</span>
      }
    </div>
    @if (r.isOnline && r.locationUpdatedAt) {
      <span class="sub">Location {{ r.locationUpdatedAt | date: 'h:mm a' }}</span>
    }
  </ng-template>
</bb-data-table>
