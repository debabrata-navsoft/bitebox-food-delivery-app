<bb-page-header
  title="Restaurants"
  subtitle="Review new applications and manage live restaurants."
/>

<np-tabs
  class="bb-tab-strip"
  variant="underline"
  [tabs]="tabItems()"
  [activeTab]="tabs[activeTab()].status"
  (activeTabChange)="selectTabId($event)"
/>

<bb-list-toolbar
  class="toolbar"
  [list]="restaurants"
  [sections]="filterSections"
  searchLabel="Search restaurants"
  placeholder="Search by name, city or cuisine"
/>

<bb-data-table
  [list]="list"
  [columns]="columns"
  [actions]="actions"
  label="Restaurants"
  [rowsOptions]="[10, 25, 50]"
>
  <ng-template bbEmpty>
    <bb-list-empty
      [list]="restaurants"
      icon="store"
      [title]="'No ' + tabs[activeTab()].label.toLowerCase() + ' restaurants'"
      [message]="
        tabs[activeTab()].status === 'pending'
          ? 'New applications will appear here for review.'
          : undefined
      "
      noMatch="No restaurants match these filters"
    />
  </ng-template>
</bb-data-table>
