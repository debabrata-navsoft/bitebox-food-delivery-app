<bb-page-header [title]="config().title" [subtitle]="config().subtitle" />

<bb-list-toolbar
  [list]="tickets"
  [sections]="filterSections()"
  searchLabel="Search tickets"
  placeholder="Ticket, order number, subject or name"
/>

<bb-data-table
  [list]="list"
  [columns]="columns"
  label="Support tickets"
  clickable
  (rowClick)="open($event.id)"
>
  <ng-template bbEmpty>
    <bb-list-empty
      [list]="tickets"
      icon="ticket"
      title="No tickets here"
      noMatch="No tickets match these filters"
      noMatchMessage="Try a different status or search."
    />
  </ng-template>
</bb-data-table>
