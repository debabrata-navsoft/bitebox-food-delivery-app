<bb-page-header title="Users" subtitle="Every customer, restaurant partner and rider account." />

<bb-list-toolbar
  [list]="accounts"
  [sections]="filterSections"
  searchLabel="Search users"
  placeholder="Name, email, mobile or account ID"
  [sortOptions]="sortOptions"
/>

<bb-data-table
  [list]="list"
  [columns]="columns"
  [actions]="actions"
  label="Users"
  emptyIcon="user-search"
  emptyText="No users match these filters."
  [filters]="accounts"
/>
