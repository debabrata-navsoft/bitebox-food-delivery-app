<bb-page-header title="Menu" subtitle="Add dishes, set prices and switch availability on or off.">
  @if (!noRestaurant() && list.data()) {
    <np-button severity="primary" icon="plus" label="Add dish" (clicked)="openForm()" />
  }
</bb-page-header>

@if (noRestaurant()) {
  <bb-empty-state
    icon="storefront"
    title="Add your restaurant first"
    message="Create your restaurant profile, then build your menu here."
  >
    <a class="bb-btn" routerLink="/restaurant/details">Add restaurant details</a>
  </bb-empty-state>
} @else if (list.empty() && !menu.filtered()) {
  <bb-empty-state
    icon="menu_book"
    title="Your menu is empty"
    message="Add your first dish so customers can see what you serve."
  >
    <np-button severity="primary" icon="plus" label="Add your first dish" (clicked)="openForm()" />
  </bb-empty-state>
} @else {
  <bb-list-toolbar
    [list]="menu"
    [sections]="filterSections"
    searchLabel="Search dishes"
    placeholder="Search dishes"
  />

  <bb-data-table
    [list]="list"
    [columns]="columns"
    [actions]="actions"
    label="Menu"
    emptyIcon="utensils"
    emptyText="No dishes match these filters."
    [filters]="menu"
  >
    <ng-template [bbCellOf]="list" bbCell="dish" let-item>
      <div class="dish" [class.off]="!item.isAvailable">
        @if (item.imageUrl | usableImage) {
          <img [bbSrc]="item.imageUrl" alt="" loading="lazy" />
        } @else {
          <span class="thumb" aria-hidden="true"
            ><np-icon [name]="item.category.icon | npIcon: 'utensils'" class="mat-icon"
          /></span>
        }
        <span class="name"><bb-veg-badge [veg]="item.isVeg" /> {{ item.name }}</span>
      </div>
    </ng-template>
    <ng-template [bbCellOf]="list" bbCell="available" let-item>
      <np-toggle
        [checked]="item.isAvailable"
        [disabled]="busyId() === item.id"
        class="bb-toggle-stable bb-label-hidden-phone"
        [label]="item.isAvailable ? 'Available' : 'Off'"
        [attr.title]="'Available: ' + item.name"
        (checkedChange)="toggleAvailability(item, $event)"
      />
    </ng-template>
  </bb-data-table>
}
