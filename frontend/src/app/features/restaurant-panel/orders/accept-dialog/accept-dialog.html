<h2 bbDialogTitle>Accept order {{ order.orderNumber }}</h2>
<div class="bb-dialog__content body">
  <p class="summary">
    <span>{{ order | itemCount }} · {{ order.deliveryAddress.recipientName }}</span>
    <strong>{{ order.pricing.totalPaise | inr }}</strong>
  </p>

  <div>
    <p class="question" id="prep-label">How long will the food take?</p>
    <div class="times" role="group" aria-labelledby="prep-label">
      @for (m of choices; track m) {
        <button
          type="button"
          class="time"
          [attr.aria-pressed]="minutes() === m"
          (click)="minutes.set(m)"
        >
          {{ m }}<small>min</small>
        </button>
      }
    </div>
  </div>

  <p class="bb-alert success ready" aria-live="polite">
    <np-icon name="chef-hat" class="mat-icon" matButtonIcon />
    <span
      >Ready by <strong>{{ readyAt() | date: 'h:mm a' }}</strong> · the customer sees this
      time</span
    >
  </p>
</div>
<div class="bb-dialog__actions">
  <np-button variant="outlined" severity="secondary" label="Cancel" (clicked)="ref.close()" />
  <np-button
    severity="success"
    icon="check"
    [label]="'Accept · ' + minutes() + ' min'"
    (clicked)="ref.close(minutes())"
  />
</div>
