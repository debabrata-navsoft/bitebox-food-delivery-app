<form class="bb-form" [formRoot]="form">
  <np-text-input
    [formField]="form.ownerName"
    label="Owner or business name (as on documents)"
    autocomplete="organization"
  />
  <div class="bb-form-row">
    <np-text-input
      [formField]="form.fssaiNumber"
      label="FSSAI licence number"
      inputmode="numeric"
      hint="14 digits. Customers see it on the restaurant page."
      [error]="shownError(form.fssaiNumber)"
    />
    <div class="bb-field">
      <np-calendar [formField]="form.fssaiValidUntil" label="FSSAI valid until" dateFormat="dd M yy" showIcon />
    </div>
  </div>
  <np-toggle [checked]="model().gstRegistered" (checkedChange)="setGst($event)" label="Registered for GST" />
  @if (model().gstRegistered) {
    <np-text-input
      [formField]="form.gstin"
      label="GSTIN"
      autocapitalize="characters"
      [error]="shownError(form.gstin)"
    />
  }
  <div>
    <button type="submit" class="bb-btn" [disabled]="form().submitting() || !form().dirty()">
      {{ form().submitting() ? 'Saving…' : 'Save details' }}
    </button>
  </div>
</form>
