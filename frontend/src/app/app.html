@if (loading()) {
  <div class="page-loader" role="progressbar" aria-label="Loading"></div>
}
<router-outlet />
@if (changingPage()) {
  <bb-brand-loader overlay label="Opening the page" />
}
<!-- Deferred so its UI libraries stay out of the first download (the service worker caches it). -->
@defer (on idle) {
  <bb-app-status />
}
