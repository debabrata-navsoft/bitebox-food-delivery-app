<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BiteBox - Food Delivery</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- <link rel="icon" type="image/x-icon" href="favicon.png" /> -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/bitebox-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Dark theme before the first paint (no light flash). Same key and rules as core/services/theme.service.ts.
         The SSR server swaps CSP_NONCE for a fresh nonce on every page (src/server.ts, Content-Security-Policy). -->
    <script nonce="CSP_NONCE">
      (function () {
        try {
          var stored = localStorage.getItem('bb-theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#120c17');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Installed app (standalone): full-screen on iOS/Android, with a light status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BiteBox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="msapplication-TileColor" content="#2e1a3d" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="application-name" content="BiteBox" />
    <meta name="description" content="BiteBox - order food from your favourite local restaurants and track your delivery live." />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- The app's launch splash (shown inside <app-root> until Angular renders the first page).
         Same box, lid and dashes as shared/components/brand-loader; plum like the manifest's
         background_color, so the installed app goes from the phone's splash straight into it. -->
    <style>
      .bb-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: radial-gradient(circle at 50% 35%, #43295a 0%, #2e1a3d 60%);
        color: #ffb52e;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      .bb-splash svg {
        width: 84px;
        height: 84px;
        filter: drop-shadow(0 14px 24px rgb(0 0 0 / 35%));
      }
      .bb-splash .lid {
        transform-box: fill-box;
        transform-origin: left bottom;
        animation: bb-lid 1.2s ease-in-out infinite;
      }
      .bb-splash__name {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff6e5;
      }
      .bb-splash__name b {
        color: #ffb52e;
      }
      .bb-splash__dashes {
        position: relative;
        width: 96px;
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 181 46 / 22%);
      }
      .bb-splash__dashes i {
        position: absolute;
        top: 0;
        left: -18px;
        width: 16px;
        height: 100%;
        border-radius: 999px;
        background: #ffb52e;
        animation: bb-dash 1.2s linear infinite;
      }
      .bb-splash__dashes i:nth-child(2) {
        animation-delay: 0.4s;
      }
      .bb-splash__dashes i:nth-child(3) {
        animation-delay: 0.8s;
      }
      @keyframes bb-lid {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }
        40%,
        60% {
          transform: translateY(-7px) rotate(-14deg);
        }
      }
      @keyframes bb-dash {
        to {
          transform: translateX(132px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bb-splash .lid,
        .bb-splash__dashes i {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="mat-typography">
    <app-root ngCspNonce="CSP_NONCE">
      <div class="bb-splash" role="status" aria-label="Opening BiteBox">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#2E1A3D" />
          <rect class="lid" x="9" y="14" width="46" height="12" rx="4" fill="#FFB52E" />
          <rect x="12" y="28.5" width="40" height="25.5" rx="5" fill="#FFB52E" />
          <path d="M25.5 38.5 Q32 44.5 38.5 38.5" fill="none" stroke="#2E1A3D" stroke-width="3.4" stroke-linecap="round" />
        </svg>
        <div class="bb-splash__name">Bite<b>Box</b></div>
        <span class="bb-splash__dashes" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </app-root>
    <noscript>BiteBox needs JavaScript to run. Please enable it in your browser settings.</noscript>
  </body>
</html>
