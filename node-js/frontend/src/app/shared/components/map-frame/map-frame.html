<div class="frame" [cdkTrapFocus]="full()">
  @if (full()) {
    <header class="head">
      <h2>{{ title() }}</h2>
      <ng-content select="[mapActions]" />
      <button
        #closeBtn
        type="button"
        class="bb-btn bb-btn--outlined bb-btn--icon"
        aria-label="Exit full screen"
        (click)="close()"
      >
        <np-icon name="minimize-2" />
      </button>
    </header>
  }
  <div class="body">
    <ng-content />
    @if (!full()) {
      <button
        #openBtn
        type="button"
        class="bb-btn bb-btn--soft bb-btn--icon expand"
        aria-label="Show map full screen"
        title="Full screen"
        (click)="open()"
      >
        <np-icon name="maximize-2" />
      </button>
    }
  </div>
</div>
