<h2 bbDialogTitle>{{ isNew ? 'Add your vehicle' : 'Change your vehicle' }}</h2>
<form [formRoot]="form" novalidate>
  <div class="bb-dialog__content">
    <p class="bb-muted">Restaurants and customers see this when you pick up their order.</p>
    <div class="bb-field">
      <np-select
        [formField]="form.vehicleType"
        label="Vehicle"
        placeholder="Choose"
        [options]="options"
      />
      <bb-field-error [field]="form.vehicleType" />
    </div>
    <np-text-input
      [formField]="form.vehicleNumber"
      label="Registration number (optional)"
      placeholder="e.g. KA 01 AB 1234"
      autocapitalize="characters"
      [error]="shownError(form.vehicleNumber)"
    />
  </div>
  <div class="bb-dialog__actions">
    <np-button variant="soft" severity="secondary" label="Cancel" (clicked)="ref.close()" />
    <button type="submit" class="bb-btn" [disabled]="form().submitting()">
      {{ form().submitting() ? 'Saving…' : 'Save vehicle' }}
    </button>
  </div>
</form>
